[project]
name = "vercel-flask-starter"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "flask>=3.1,<4.0",
  "gunicorn~=23.0.0",
  "supabase>=2.9,<3.0",
  "python-dotenv>=1.0,<2.0"
]

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = ["endpoints*"]